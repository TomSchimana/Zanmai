  - "zanmai/user.md"
  - "zanmai/extensions/**"
  - "zanmai/connections/**"
  - "zanmai/memory/**"
  - "zanmai/logs/**"
  - "zanmai/history/**"
  - "zanmai/temp/**"
  - "zanmai/trash/**"
  - "zanmai/open/**"
  - "zanmai/runtime/**"
  # The user's own areas, all of them minus the system folder.
  - "journal/**"
  - "inbox/**"
  - "workbench/**"
  - "life/**"
  - "knowledge/**"
  - "archive/**"
  - "contacts/**"
  - "INDEX.md"

# The folders a set-up space must have are NOT listed here. They live once, in
# REQUIRED_FOLDERS_CORE in zanmai.py, and every place that creates or checks them
# reads that list. They were listed in both, and the two drifted: a release added
# an area to the script and not here, so a fresh install got the folder
# and an updated space did not. The structure check read this copy as well, which is
# what made the drift invisible instead of merely wrong: whoever creates and whoever
# checks agreed with each other, both missing the same entry, and a space without the
# folder passed validation. Do not reintroduce the list.

