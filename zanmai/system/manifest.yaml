# Zanmai distribution manifest
#
# distribution_version is the Zanmai release as a whole. Bumps when files
# under distribution_paths change. The authority is zanmai/system/VERSION.
# schema_version is the frontmatter schema specifically; bumped when fields
# or kinds change. Both can move independently.
# distribution_paths get overwritten on update.
# user_immune_paths are never touched on update.

distribution_version: "0.6.0"
phase: "phase-1"
schema_version: "0.1.0"

# where `setup upgrade` looks for a newer version, over HTTPS, so a space
# updates whether it was cloned or unpacked from an archive.
#
# If you are distributing your own version of Zanmai, this line is not
# optional to change. Left as it is, every copy you hand out checks OUR repository
# on every session start, tells your users an update is available, and on yes
# writes our files over your own version and your material. Point it at your own
# repository, or set update_check to false. The update message names the
# repository it asked, so a wrong one is visible rather than silent.
update_source: "TomSchimana/Zanmai"
update_branch: "main"
update_check: true

distribution_paths:
