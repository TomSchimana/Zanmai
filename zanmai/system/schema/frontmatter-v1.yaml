# Frontmatter schema v1
#
# Read by kind-required.py hook and by templates.
# Required fields refuse writes that lack them; optional fields are guidance only.

version: "0.1.0"

common:
  # every bundle file and entity file carries these
  required:
    - kind         # one of: focus, doing, habit, knowledge, contact/person, contact/organization
    - slug         # kebab-case, ASCII, matches filename without .md
    - created      # YYYY-MM-DD
  optional:
    - updated      # YYYY-MM-DD; defaults to created when absent
    - source       # enum: organic (user wrote it), collaborative (user + AI together), ai-generated (AI wrote it).
    - source_detail # free-text refinement when relevant (e.g. "import:<source>-<YYYY-MM>", "session:close-<YYYY-MM-DD>")
    - tags         # array of strings
    - mentioned_in # array of source slugs where an auto-stubbed entity surfaced (set by `contact create --mentioned-in <slug>`).

# What `status:` may say. Set it with `zanmai.py file status --path <p> --set <value>`, never by
# hand: the value has a vocabulary and a typo silences nothing while looking as if it did.
#
#   active     runs, and its open points are current
#   waiting    parked on purpose, on something outside; add `due:` for when it comes back
#   done       finished; open points on it are history, not work
#   cancelled  does not happen any more; open points on it are void
#   unclear    seen but not settled; somebody has to look at it
#
# `done` and `cancelled` take the file's open task lines and its dates out of what the session
# start offers. The kind-specific values below (planning, wrap-up, awaiting-archive) say where
# inside `active` something sits and are treated as active.

kinds:

  focus:
    description: active attention bundles. user is working on this.
    # Only the bundle's truth file (`<bundle-slug>.md`) is required to carry goal/status.
    # Member files inside the bundle inherit kind: focus from the bundle path but do not
    # need their own goal/status. They are material, not separate focus instances.
    required_for_hub_only:
      - goal       # one-line statement of the outcome
      - status     # planning, active, wrap-up, plus the shared lifecycle values above
    required: []
    optional:
      - goal
      - status
      - due        # YYYY-MM-DD when applicable

  doing:
    description: the desk. one bundle per piece of work that has an end, with every draft of it together.
    # Nothing beyond the common fields is required, and that is deliberate: what clears a bundle
    # off the desk is read from the file dates, not from a field that has to be kept true by hand.
    required: []
    optional:
      - status     # the shared lifecycle values above
      - due        # YYYY-MM-DD when the piece has a real deadline

  habit:
    description: recurring routines. user does this regularly.
    # Same hub/member split as focus.
    required_for_hub_only:
      - cadence    # enum: daily, weekly, monthly, quarterly, irregular
    required: []
    optional:
      - cadence
      - last_done  # YYYY-MM-DD
      - status     # a routine that stopped says so here rather than being deleted

  knowledge:
    description: persistent reference. default class for unsure material.
    required: []
    optional:
      - topic      # one-line topic descriptor
      - status     # awaiting-archive for a read-once briefing on the desk, plus the shared lifecycle values above

  record:
    description: a document kept because it has to be, or because it would be needed again.
    # Nothing beyond the common fields is required. A scan that arrives before anyone has worked
    # out what it is still has to be filable; what turns it into a record with a term on it is
    # `retention_policy`, set once somebody knows.
    required: []
    optional:
      - doc_type          # what it is: invoice, policy, contract, certificate, pay slip, notice
      - lifecycle         # active, retention-bound, evidence-only, expired
      - retention_policy  # forever, ten-years, four-years
      - retention_until   # YYYY-MM-DD, where the policy resolves to a day
      - relates_to        # slug of the document or matter this belongs to
      - relates_via       # pays, cancels, confirms, amends, replaces, references, part-of
      - source_path       # where the original file lies, if not beside this note
      - status            # the shared lifecycle values above
      - due               # YYYY-MM-DD, where something has to happen by a date

  contact/person:
    description: people the user knows.
    required: []
    optional:
      - nickname   # how the user actually calls this person, when that differs from the first name. Voice notes read it, because it is the form that gets spoken.
      - role       # job title or relationship
      - org        # slug of the organization (resolves to contacts/organisations/<slug>.md)
      - email
      - phone
      - birthday   # YYYY-MM-DD
      - address    # postal
      - website    # URL or LinkedIn

  contact/organization:
    description: organisations the user interacts with.
    required: []
    optional:
      - kind_of    # e.g. employer, vendor, club, school
      - website
