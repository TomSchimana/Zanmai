# Zanmai distribution manifest
#
# distribution_version is the Zanmai release as a whole. Bumps when files
# under distribution_paths change. The authority is .zanmai/system/VERSION.
# schema_version is the frontmatter schema specifically; bumped when fields
# or kinds change. Both can move independently.
# distribution_paths get overwritten on update.
# user_immune_paths are never touched on update.

distribution_version: "0.3.6"
phase: "phase-1"
schema_version: "0.1.0"

# where `setup upgrade` looks for a newer version, over HTTPS, so a vault
# updates whether it was cloned or unpacked from an archive
update_source: "TomSchimana/Zanmai"
update_branch: "main"

distribution_paths:
  # everything under .zanmai/system/ ships with the distribution
  - "CLAUDE.md"
  - "README.md"
  - ".gitignore"
  - ".zanmai/system/VERSION"
  - ".zanmai/system/operating-principles.md"
  - ".zanmai/system/manifest.yaml"
  - ".zanmai/system/tool-register.json"
  # Official EU AI-content labelling icons (3 classes x 4 colour treatments, PNG + SVG)
  - ".zanmai/system/assets/eu-ai-icons/base-black.png"
