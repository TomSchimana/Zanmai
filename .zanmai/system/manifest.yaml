# Conditional folders, created only when the corresponding ZenNotes feature is
# enabled in .zennotes/vault.json (surfaced in .zanmai/vault-config.md).
# Folder name and location come from vault.json (primaryNotesLocation +
# directory). When vault.json is absent or the feature is disabled, the
# folders simply do not exist for this vault. The validator does not require
# these to exist.
